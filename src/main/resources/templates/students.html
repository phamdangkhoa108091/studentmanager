<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý sinh viên</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ==========================================
           1. CẤU TRÚC LAYOUT TỔNG THỂ (SIDEBAR + MAIN)
           ========================================== */
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            background-color: #f4f6f9;
            color: #333;
            min-height: 100vh;
        }

        /* Sidebar tối bên trái */
        .sidebar {
            width: 230px;
            background-color: #1a1c23;
            color: #c2c7d0;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }

        .sidebar-brand {
            padding: 20px 15px;
            font-size: 18px;
            font-weight: 500;
            color: #ffffff;
            border-bottom: 1px solid #2d303e;
        }

        .sidebar-menu {
            list-style: none;
            padding: 15px 10px;
        }

        .sidebar-menu li {
            margin-bottom: 5px;
        }

        .sidebar-menu a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 15px;
            color: #c2c7d0;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.2s;
        }

        .sidebar-menu li.active a,
        .sidebar-menu a:hover {
            background-color: #2d303e;
            color: #ffffff;
        }

        /* Khu vực nội dung chính */
        .main-content {
            flex: 1;
            padding: 25px 30px;
            overflow-y: auto;
        }

        /* Header & Breadcrumb */
        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .content-header h1 {
            font-size: 26px;
            font-weight: 500;
            color: #212529;
        }

        .breadcrumb {
            font-size: 14px;
            color: #6c757d;
        }

        /* ==========================================
           2. THẺ CARD CHỨA BẢNG VÀ CÔNG CỤ
           ========================================== */
        .card {
            background: #ffffff;
            border-radius: 6px;
            border: 1px solid #de2e2;
            box-shadow: 0 0 1px rgba(0, 0, 0, .125), 0 1px 3px rgba(0, 0, 0, .2);
        }

        .card-header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f4f4f4;
        }

        .card-title {
            font-size: 16px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #333;
        }

        /* Thanh tìm kiếm */
        .search-bar-row {
            padding: 15px 20px;
            display: flex;
            gap: 10px;
        }

        .search-input {
            width: 320px;
            padding: 8px 12px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }

        .search-input:focus {
            border-color: #80bdff;
        }

        /* Nút Bấm */
        .btn {
            padding: 8px 16px;
            border-radius: 4px;
            border: none;
            font-size: 14px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 400;
            transition: background 0.2s;
        }

        .btn-primary { background-color: #007bff; color: white; }
        .btn-primary:hover { background-color: #0069d9; }

        .btn-warning { background-color: #ffc107; color: #212529; }
        .btn-warning:hover { background-color: #e0a800; }

        .btn-danger { background-color: #dc3545; color: white; }
        .btn-danger:hover { background-color: #c82333; }

        .btn-secondary { background-color: #6c757d; color: white; }
        .btn-secondary:hover { background-color: #5a6268; }

        .btn-sm {
            padding: 4px 10px;
            font-size: 13px;
        }

        /* ==========================================
           3. BẢNG DỮ LIỆU
           ========================================== */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-top: 1px solid #dee2e6;
            vertical-align: middle;
        }

        th {
            background-color: #ffffff;
            font-weight: 600;
            color: #212529;
            border-bottom: 2px solid #dee2e6;
            white-space: nowrap;
        }

        th i {
            font-size: 11px;
            color: #aaa;
            margin-left: 4px;
        }

        tbody tr:nth-of-type(even) {
            background-color: #f8f9fa;
        }

        tbody tr:hover {
            background-color: #f1f3f5;
        }

        /* ==========================================
           4. MODAL BẢNG NỔI
           ========================================== */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(2px);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background-color: #fff;
            width: 500px;
            max-width: 90%;
            border-radius: 6px;
            padding: 20px 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #dee2e6;
        }

        .modal-header h3 {
            font-size: 18px;
            font-weight: 500;
            color: #212529;
        }

        .close-btn {
            background: none; border: none; font-size: 20px; color: #aaa; cursor: pointer;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            margin-bottom: 6px;
            color: #495057;
        }

        .form-group input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #80bdff;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #dee2e6;
        }
    </style>
</head>

<body>

<!-- SIDEBAR BÊN TRÁI -->
<div class="sidebar">
    <div class="sidebar-brand">
        University Training
    </div>
    <ul class="sidebar-menu">
        <li class="active">
            <a href="#"><i class="fa-solid fa-users"></i> Sinh viên</a>
        </li>
        <li>
            <a href="#"><i class="fa-regular fa-newspaper"></i> Học phần</a>
        </li>
        <li>
            <a href="#"><i class="fa-solid fa-door-open"></i> Phòng học</a>
        </li>
    </ul>
</div>

<!-- NỘI DUNG CHÍNH BÊN PHẢI -->
<div class="main-content">

    <!-- Header & Breadcrumb -->
    <div class="content-header">
        <h1>Quản lý sinh viên</h1>
        <div class="breadcrumb">
            Home / Sinh viên
        </div>
    </div>

    <!-- Card Khung Bảng -->
    <div class="card">
        <div class="card-header">
            <div class="card-title">
                <i class="fa-solid fa-users"></i> Danh sách sinh viên
            </div>
            <button class="btn btn-primary" onclick="showAddForm()">
                <i class="fa-solid fa-plus"></i> Thêm sinh viên
            </button>
        </div>

        <!-- Thanh Tìm Kiếm -->
        <div class="search-bar-row">
            <input type="text" id="searchInput" class="search-input" placeholder="Tìm mã SV, họ tên, email..." onkeyup="searchStudent()">
            <button class="btn btn-primary" onclick="searchStudent()">
                <i class="fa-solid fa-magnifying-glass"></i> Tìm kiếm
            </button>
            <button class="btn btn-secondary" onclick="clearSearch()">Hủy lọc</button>
        </div>

        <!-- Bảng Danh Sách -->
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>STT <i class="fa-solid fa-sort"></i></th>
                        <th>Mã sinh viên <i class="fa-solid fa-sort"></i></th>
                        <th>Họ và tên <i class="fa-solid fa-sort"></i></th>
                        <th>Email <i class="fa-solid fa-sort"></i></th>
                        <th>Số điện thoại <i class="fa-solid fa-sort"></i></th>
                        <th>Lớp <i class="fa-solid fa-sort"></i></th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody id="studentTableBody">
                    <tr th:each="student, iterStat : ${students}">
                        <td class="stt-cell" th:text="${iterStat.count}">1</td>
                        <td th:text="${student.studentCode}">SV001</td>
                        <td th:text="${student.fullName}">Nguyễn Văn Ánh</td>
                        <td th:text="${student.email}">nguyenvanan@gmail.com</td>
                        <td th:text="${student.phone}">0901234567</td>
                        <td th:text="${student.className}">C2024A</td>
                        <td>
                            <button class="btn btn-warning btn-sm" th:attr="onclick=|editStudent('${student.id}', '${student.studentCode}', '${student.fullName}', '${student.email}', '${student.phone}', '${student.className}')|">
                                <i class="fa-solid fa-pen"></i> Sửa
                            </button>
                            <button class="btn btn-danger btn-sm" th:attr="onclick=|deleteStudent('${student.id}')|">
                                <i class="fa-solid fa-trash"></i> Xóa
                            </button>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(students)}" id="emptyRow">
                        <td colspan="7" style="text-align: center; color: #dc3545; padding: 20px;">Không có dữ liệu sinh viên!</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- ==========================================
     MODAL BẢNG NỔI THÊM / SỬA SINH VIÊN
     ========================================== -->
<div class="modal-overlay" id="modalOverlay" onclick="handleOutsideClick(event)">
    <div class="modal-content" id="modalContent">
        <div class="modal-header">
            <h3 id="formTitle">Thêm sinh viên</h3>
            <button class="close-btn" onclick="closeForm()">&times;</button>
        </div>

        <div class="form-group">
            <label>Mã sinh viên</label>
            <input type="text" id="studentCode" placeholder="Nhập mã sinh viên">
        </div>

        <div class="form-group">
            <label>Họ và tên</label>
            <input type="text" id="fullName" placeholder="Nhập họ và tên">
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="Nhập email">
        </div>

        <div class="form-group">
            <label>Số điện thoại</label>
            <input type="text" id="phone" placeholder="Nhập số điện thoại">
        </div>

        <div class="form-group">
            <label>Lớp</label>
            <input type="text" id="className" placeholder="Nhập lớp học">
        </div>

        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeForm()">Hủy</button>
            <button class="btn btn-primary" onclick="saveStudent()">Lưu lại</button>
        </div>
    </div>
</div>

<script>
    let editingId = null;

    // ==================================================
    // TÌM KIẾM & ĐẨY TÊN KHỚP CHÍNH XÁC LÊN ĐẦU BẢNG
    // ==================================================
    function searchStudent() {
        const keyword = document.getElementById("searchInput").value.trim().toLowerCase();
        const tbody = document.getElementById("studentTableBody");
        const rows = Array.from(tbody.querySelectorAll("tr")).filter(r => r.cells.length > 1);

        if (!keyword) {
            rows.forEach((r, idx) => {
                r.style.display = "";
                r.querySelector(".stt-cell").textContent = idx + 1;
            });
            return;
        }

        const scoredRows = rows.map(row => {
            const code = row.cells[1].textContent.trim().toLowerCase();
            const fullName = row.cells[2].textContent.trim().toLowerCase();
            const email = row.cells[3].textContent.trim().toLowerCase();
            const phone = row.cells[4].textContent.trim().toLowerCase();

            let score = 99;

            if (fullName === keyword) score = 0;           // Khớp 100% tên đầy đủ
            else if (fullName.startsWith(keyword)) score = 1; // Bắt đầu bằng từ khóa
            else if (fullName.includes(keyword)) score = 2;   // Chứa từ khóa
            else if (code.includes(keyword) || email.includes(keyword) || phone.includes(keyword)) score = 3;

            return { row, score };
        });

        rows.forEach(r => r.style.display = "none");

        const matchedRows = scoredRows.filter(item => item.score < 99);
        matchedRows.sort((a, b) => a.score - b.score);

        matchedRows.forEach((item, index) => {
            item.row.style.display = "";
            item.row.querySelector(".stt-cell").textContent = index + 1; // Đánh lại STT 1, 2, 3...
            tbody.appendChild(item.row);
        });
    }

    function clearSearch() {
        document.getElementById("searchInput").value = "";
        searchStudent();
    }

    // ==================================================
    // TÁC VỤ MODAL (MỞ / ĐÓNG FORM NỔI)
    // ==================================================
    function openModal() {
        document.getElementById("modalOverlay").classList.add("active");
    }

    function closeForm() {
        document.getElementById("modalOverlay").classList.remove("active");
    }

    function handleOutsideClick(event) {
        const modalContent = document.getElementById("modalContent");
        if (!modalContent.contains(event.target)) {
            closeForm();
        }
    }

    function showAddForm() {
        editingId = null;
        document.getElementById("formTitle").innerText = "Thêm sinh viên";
        document.getElementById("studentCode").value = "";
        document.getElementById("fullName").value = "";
        document.getElementById("email").value = "";
        document.getElementById("phone").value = "";
        document.getElementById("className").value = "";
        openModal();
    }

    function editStudent(id, studentCode, fullName, email, phone, className) {
        editingId = id;
        document.getElementById("formTitle").innerText = "Cập nhật sinh viên";
        document.getElementById("studentCode").value = studentCode;
        document.getElementById("fullName").value = fullName;
        document.getElementById("email").value = email;
        document.getElementById("phone").value = phone;
        document.getElementById("className").value = className;
        openModal();
    }

    // ==================================================
    // LƯU (POST/PUT) VÀ XÓA (DELETE) VIA FETCH API
    // ==================================================
    function saveStudent() {
        const student = {
            studentCode: document.getElementById("studentCode").value.trim(),
            fullName: document.getElementById("fullName").value.trim(),
            email: document.getElementById("email").value.trim(),
            phone: document.getElementById("phone").value.trim(),
            className: document.getElementById("className").value.trim()
        };

        if (!student.studentCode || !student.fullName) {
            alert("Vui lòng nhập Mã sinh viên và Họ tên!");
            return;
        }

        let url = editingId !== null ? "/api/students/" + editingId : "/api/students";
        let method = editingId !== null ? "PUT" : "POST";

        fetch(url, {
            method: method,
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(student)
        })
        .then(response => {
            if (!response.ok) throw new Error("Có lỗi xảy ra khi lưu dữ liệu!");
            return response.json();
        })
        .then(() => {
            alert(editingId === null ? "Thêm sinh viên thành công!" : "Cập nhật thành công!");
            location.reload();
        })
        .catch(error => alert(error.message));
    }

    function deleteStudent(id) {
        if (!confirm("Bạn có chắc chắn muốn xóa sinh viên này không?")) return;

        fetch("/api/students/" + id, { method: "DELETE" })
        .then(response => {
            if (!response.ok) throw new Error("Xóa thất bại!");
            alert("Xóa thành công!");
            location.reload();
        })
        .catch(error => alert(error.message));
    }
</script>

</body>
</html>
